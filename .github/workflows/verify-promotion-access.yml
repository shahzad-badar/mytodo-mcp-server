name: Verify promotion access

# This read-only check confirms that prod's deployer can read dev's image registry.
# Run it before the first prod deploy and whenever a promotion fails to read dev's image.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to check. Blank checks the tip of main.
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  mcp:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Check read access to dev's image
        env:
          SOURCE_IMAGE: ${{ vars.PROMOTE_SOURCE_IMAGE }}
          SHA: ${{ inputs.sha || github.sha }}
        run: scripts/verify-promotion-access.sh
